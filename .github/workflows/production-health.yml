name: Production health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health/ready
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "${{ secrets.PRODUCTION_HEALTH_URL }}/health/ready"
