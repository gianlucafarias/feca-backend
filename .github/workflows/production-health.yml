name: Production health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check /health/ready
        run: |
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "${{ secrets.PRODUCTION_HEALTH_URL }}/health/ready"

      - name: Check notification delivery pipeline
        run: |
          curl -fsS --connect-timeout 5 --max-time 15 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "x-feca-internal-secret: ${{ secrets.PRODUCTION_INTERNAL_SECRET }}" \
            "${{ secrets.PRODUCTION_HEALTH_URL }}/internal/notifications/status"

      - name: Check host and latest backup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.HETZNER_DEPLOY_PATH }}"
            ./scripts/check-host-health.sh
